<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <title>NLL Player 2.6</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link rel="stylesheet" href="style/style.css">
   <link rel="icon" type="image/png" href="favicon/nllplayer2.png">
</head>
<body>
   <div class="bg-glow"></div>

   <div class="container">
      <header>
         <div class="title-group">
            <h1>NLL Player 2.6</h1>
            <span class="badge">WebAudio</span>
         </div>
         <div class="track-name" id="trackName">No Media Loaded</div>
      </header>

      <div class="visualizer-wrapper">
         <video id="mediaVideo" playsinline></video>
         <canvas id="spectrumCanvas"></canvas>

         <label class="file-dropzone" id="dropzone" for="audioFileInput">
            <div class="upload-btn">
               <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="17 8 12 3 7 8"></polyline>
                  <line x1="12" y1="3" x2="12" y2="15"></line>
               </svg>
               Select MP3 or MP4
            </div>
            <div class="file-hint">NLL Player Spectrum</div>
         </label>
         <input type="file" id="audioFileInput" accept=".mp3,.mp4">
      </div>

      <div class="controls">
         <div class="progress-bar-container">
            <span class="time-stamp" id="currentTime">00:00</span>
            <div class="progress-bar" id="progressBar">
               <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="time-stamp" id="durationTime">00:00</span>
         </div>

         <div class="control-buttons">
            <button class="btn btn-play" id="btnPlay">
               <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
               </svg>
               <svg id="pauseIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                  <rect x="6" y="4" width="4" height="16"></rect>
                  <rect x="14" y="4" width="4" height="16"></rect>
               </svg>
            </button>
            <label class="btn" for="audioFileInput" title="Open File">
               <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width: "2">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
               </svg>
            </label>
         </div>
      </div>

      <footer>&copy; Copyright 2026 devnull93</footer>
   </div>

   <script src="src/script.js"></script>
</body>
</html>
